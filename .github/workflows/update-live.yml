name: 유튜브 조회수 자동 갱신

on:
  schedule:
    - cron: "*/30 * * * *"   # 약 30분마다 (GitHub 사정으로 몇 분 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 조회수 받기
        run: node scripts/update-live.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/live.js
          git diff --cached --quiet || git commit -m "조회수 자동 갱신"
          git push
